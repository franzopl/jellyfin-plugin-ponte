name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (Jellyfin 10.11 and 12.x)
        run: dotnet build Jellyfin.Plugin.Ponte.sln -c Release

      - name: Unit tests
        run: dotnet test --project tests/Jellyfin.Plugin.Ponte.Tests -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: src/Jellyfin.Plugin.Ponte/bin/Release/*/Jellyfin.Plugin.Ponte.dll

  smoke:
    # Loads the plugin into real Jellyfin servers and walks the addon like a Stremio client.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ["10.11.11", "12.1", "12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: src/Jellyfin.Plugin.Ponte/bin/Release

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Start Jellyfin ${{ matrix.jellyfin }} with the plugin
        run: scripts/dev-server.sh "${{ matrix.jellyfin }}" 8800

      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8800

      - name: Jellyfin log
        if: failure()
        run: docker logs "ponte-jellyfin-${{ matrix.jellyfin }}" 2>&1 | tail -200
